<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101114"><title>My Resolutions</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=Google+Sans+Text:wght@400;500;600&display=swap');
:root{--bg:#101114;--s:#191a1f;--s2:#25262d;--p:#a8c7fa;--op:#082f61;--t:#e6e1e9;--m:#b9b6be;--g:#a8d5ba;--gb:#193b2b;--w:#f1c66d;--wb:#3d3017;--r:#ffb4ab;--rb:#54211e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:"Google Sans Text",sans-serif}.app{max-width:520px;margin:auto;min-height:100vh;padding-bottom:90px}.top{height:70px;position:sticky;top:0;z-index:5;background:#101114ed;backdrop-filter:blur(18px);display:flex;align-items:center;gap:12px;padding:12px 16px}.back{width:44px;height:44px;border:0;border-radius:50%;background:0 0;color:var(--t);font-size:26px}.title{font-family:"Google Sans";font-size:21px;font-weight:600}main{padding:0 18px 24px}.hero{padding:25px 4px 18px}.eyebrow,.sub,.small{color:var(--m);font-size:13px}.hero h1{font:600 34px/1.1 "Google Sans";margin:7px 0}.card{background:var(--s);border-radius:24px;padding:17px;margin:11px 0}.blue{background:var(--p);color:var(--op);border-radius:27px;padding:20px}.big{font:600 38px "Google Sans"}.progress{height:8px;background:#0002;border-radius:9px;margin:17px 0 9px;overflow:hidden}.progress i{display:block;height:100%;background:currentColor}.section{font-size:12px;color:var(--m);text-transform:uppercase;letter-spacing:.7px;margin:25px 4px 9px}.res{display:flex;align-items:center;gap:12px;padding:14px 2px;border-bottom:1px solid #77747d22}.res:last-child{border:0}.ico{width:42px;height:42px;border-radius:14px;background:var(--s2);display:grid;place-items:center;font-size:21px}.body{flex:1}.name{font:500 15px "Google Sans"}.note{font-size:12px;color:var(--m);margin-top:3px}.pill{border:0;border-radius:99px;padding:8px 11px;background:var(--gb);color:var(--g);font-size:11px;font-weight:600}.warn{background:var(--wb);color:var(--w)}.bad{background:var(--rb);color:var(--r)}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);height:76px;background:#15161af2;display:grid;grid-template-columns:repeat(4,1fr);z-index:10;border-top:1px solid #77747d22}.nav button{border:0;background:0;color:var(--m);font-size:10px}.nav button.active{color:var(--p)}.nav svg{display:block;margin:auto auto 3px;width:22px;height:22px}.fab{position:fixed;right:max(18px,calc((100vw - 520px)/2 + 18px));bottom:88px;width:54px;height:54px;border:0;border-radius:18px;background:var(--p);color:var(--op);z-index:11;font-size:25px}.months{display:grid;gap:10px}.month{background:var(--s);border-radius:22px;padding:16px}.mtop{display:flex;justify-content:space-between}.mn{font:600 18px "Google Sans"}.score{font:600 21px "Google Sans"}.bar{height:7px;background:var(--s2);border-radius:8px;margin-top:14px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g)}.detail{margin-top:12px}.row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #77747d18;font-size:12px}.row span{color:var(--m)}.calhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.calhead b{font:600 21px "Google Sans"}.calhead button{width:40px;height:40px;border:0;border-radius:50%;background:var(--s2);color:var(--t);font-size:23px}.weeks,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.weeks div{text-align:center;color:var(--m);font-size:10px;padding:4px}.day{aspect-ratio:1;border:0;border-radius:12px;background:var(--s);color:var(--t);position:relative}.today{outline:2px solid var(--p)}.dot{width:5px;height:5px;border-radius:50%;position:absolute;bottom:6px;left:50%;transform:translateX(-50%);background:var(--g)}.dot.w{background:var(--w)}.dot.r{background:var(--r)}.legend{display:flex;gap:14px;margin-top:14px;color:var(--m);font-size:11px}.legend i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--g)}.legend i.w{background:var(--w)}.legend i.r{background:var(--r)}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:var(--s);border-radius:20px;padding:16px}.metric b{font:600 28px "Google Sans"}.metric span{display:block;color:var(--m);font-size:11px;margin-top:4px}.compare{background:var(--s);border-radius:22px;overflow:hidden}.cr{display:grid;grid-template-columns:1.3fr repeat(4,1fr);min-height:50px;align-items:center;border-bottom:1px solid #77747d18;padding:0 10px;font-size:11px}.cr:last-child{border:0}.cr>*:not(:first-child){text-align:center}.cr.head{color:var(--m);font-size:10px;font-weight:600}.sheet{position:fixed;inset:0;background:#0009;z-index:30;display:none;align-items:end}.panel{width:min(520px,100%);background:var(--s);border-radius:28px 28px 0 0;padding:12px 18px 28px}.handle{width:32px;height:4px;background:#777;border-radius:9px;margin:auto auto 18px}.opts{display:grid;gap:8px}.opt{border:0;border-radius:18px;background:var(--s2);color:var(--t);padding:15px;text-align:left}.opt b{display:block;font-weight:500}.opt small{color:var(--m)}textarea{width:100%;min-height:120px;background:var(--s2);border:1px solid #777;color:var(--t);border-radius:16px;padding:13px}.save{width:100%;border:0;border-radius:17px;background:var(--p);color:var(--op);padding:13px;margin-top:9px;font-weight:600}
</style></head><body><div class="app"><header class="top"><button class="back" onclick="back()">‹</button><div class="title">My resolutions</div></header><main id="main"></main><button class="fab" onclick="openDay(TODAY)">＋</button>
<nav class="nav"><button id="today" onclick="setView('today')">⌂<br>Today</button><button id="months" onclick="setView('months')">▦<br>Months</button><button id="calendar" onclick="setView('calendar')">▣<br>Calendar</button><button id="report" onclick="setView('report')">▥<br>Report</button></nav></div>
<div class="sheet" id="sheet" onclick="if(event.target===this)closeSheet()"><div class="panel"><div class="handle"></div><h2 id="st"></h2><p class="sub" id="ss"></p><div class="opts" id="opts"></div></div></div>
<script>
const START=new Date('2026-10-01'),END=new Date('2027-01-01'),TODAY=new Date().toISOString().slice(0,10),N=93;
const db=JSON.parse(localStorage.getItem('resolutions-final')||'{"days":{},"reflection":""}');
const months=[['October',2026,9],['November',2026,10],['December',2026,11],['January',2027,0]];
const R=[['health','Health','Physical + mental health','♥','habit'],['food','Fried food','Keep it lower','◒','habit'],['phone','11:30 PM boundary','No phone after 11:30','▯','habit'],['move','Stay active','Gym or movement','↗','flex'],['family','Family + myself','Make time for both','♧','flex'],['mind','Mindset','Only log a situation','◌','event']];
let view='today',cm=0;
const k=d=>d.toISOString().slice(0,10),D=k=>db.days[k]||(db.days[k]={});
function save(){localStorage.setItem('resolutions-final',JSON.stringify(db))}
function st(id,k){let v=D(k)[id];return !v?['On track','']:v==='bad'?['Missed','bad']:v==='busy'?['Busy','warn']:v==='done'?['Done','']:v==='handled'?['Handled well','']:['Could improve','bad']}
function dc(k){let a=Object.values(D(k));return a.some(x=>x==='bad'||x==='improve')?'r':a.includes('busy')?'w':a.some(x=>x&&x!=='ok')?'g':''}
function setView(v){view=v;render()}
function render(){document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));document.getElementById(view).classList.add('active');({today,monthsView,calendar,report}[view==='months'?'monthsView':view==='calendar'?'calendar':view==='report'?'report':'today'])();scrollTo(0,0)}
function today(){let p=Math.max(0,Math.min(N,Math.floor((Date.now()-START)/86400000)+1));main.innerHTML='<section class="hero"><div class="eyebrow">1 Oct 2026 → 1 Jan 2027</div><h1>Keep it simple.</h1><p class="sub">Everything starts on track. Log only what actually needs attention.</p></section><div class="blue"><div class="big">'+p+'</div><div>days into your 93-day reset</div><div class="progress"><i style="width:'+p/N*100+'%"></i></div><small>1 Oct 2026 → 1 Jan 2027</small></div><div class="section">Today</div><div class="card">'+R.map(r=>{let s=st(r[0],TODAY);return '<div class="res" onclick="openRes(\''+r[0]+'\',\''+TODAY+'\')"><div class="ico">'+r[3]+'</div><div class="body"><div class="name">'+r[1]+'</div><div class="note">'+r[2]+'</div></div><button class="pill '+s[1]+'">'+s[0]+'</button></div>'}).join('')+'</div>'}
function md(m){let ds=[],miss=0,busy=0,done=0,h=0,imp=0;for(let d=1;d<=new Date(m[1],m[2]+1,0).getDate();d++){let x=new Date(m[1],m[2],d);if(x<START||x>END)continue;ds.push(x);Object.values(D(k(x))).forEach(v=>{if(v==='bad')miss++;if(v==='busy')busy++;if(v==='done')done++;if(v==='handled')h++;if(v==='improve')imp++})}return{days:ds.length,miss,busy,done,h,imp,score:h+imp?Math.round(h/(h+imp)*100):null}}
function monthsView(){main.innerHTML='<section class="hero"><div class="eyebrow">93 days</div><h1>Months</h1><p class="sub">Open a month to see what happened.</p></section><div class="months">'+months.map((m,i)=>{let x=md(m);return '<div class="month" onclick="this.querySelector(\'.detail\').style.display=this.querySelector(\'.detail\').style.display===\'block\'?\'none\':\'block\'"><div class="mtop"><div><div class="mn">'+m[0]+' '+m[1]+'</div><div class="small">'+x.days+' days</div></div><div class="score">'+(x.score===null?'—':x.score+'%')+'</div></div><div class="bar"><i style="width:'+Math.max(4,100-x.miss*10)+'%"></i></div><div class="detail" style="display:none"><div class="row"><span>Missed</span><b>'+x.miss+'</b></div><div class="row"><span>Busy / unavailable</span><b>'+x.busy+'</b></div><div class="row"><span>Activity done</span><b>'+x.done+'</b></div><div class="row"><span>Mindset handled well</span><b>'+x.h+'</b></div><div class="row"><span>Could improve</span><b>'+x.imp+'</b></div></div></div>'}).join('')+'</div>'}
function calendar(){let m=months[cm],first=new Date(m[1],m[2],1),last=new Date(m[1],m[2]+1,0),off=(first.getDay()+6)%7,c='';for(let i=0;i<off;i++)c+='<div></div>';for(let n=1;n<=last.getDate();n++){let d=new Date(m[1],m[2],n),kk=k(d),q=dc(kk);c+='<button class="day '+(kk===TODAY?'today':'')+'" onclick="openDay(\''+kk+'\')">'+n+(q?'<i class="dot '+q+'"></i>':'')+'</button>'}main.innerHTML='<section class="hero"><div class="eyebrow">Tap a date</div><h1>Calendar</h1></section><div class="card"><div class="calhead"><b>'+m[0]+' '+m[1]+'</b><span><button onclick="event.stopPropagation();cm=Math.max(0,cm-1);calendar()">‹</button> <button onclick="event.stopPropagation();cm=Math.min(3,cm+1);calendar()">›</button></span></div><div class="weeks"><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div><div>Sun</div></div><div class="grid">'+c+'</div><div class="legend"><span><i></i>On track</span><span><i class="w"></i>Busy</span><span><i class="r"></i>Exception</span></div></div>'}
function report(){let a={miss:0,busy:0,done:0,h:0,imp:0};months.forEach(m=>{let x=md(m);a.miss+=x.miss;a.busy+=x.busy;a.done+=x.done;a.h+=x.h;a.imp+=x.imp});let score=a.h+a.imp?Math.round(a.h/(a.h+a.imp)*100):'—';main.innerHTML='<section class="hero"><div class="eyebrow">1 Oct 2026 → 1 Jan 2027</div><h1>Report</h1><p class="sub">Compare your months without pretending untouched days were checked.</p></section><div class="metrics"><div class="metric"><b>'+a.miss+'</b><span>misses</span></div><div class="metric"><b>'+a.busy+'</b><span>busy</span></div><div class="metric"><b>'+a.done+'</b><span>activity done</span></div><div class="metric"><b>'+score+(score==='—'?'':'%')+'</b><span>mindset handled</span></div></div><div class="section">Month comparison</div><div class="compare"><div class="cr head"><div>Month</div><div>Miss</div><div>Busy</div><div>Done</div><div>Mindset</div></div>'+months.map(m=>{let x=md(m);return '<div class="cr"><b>'+m[0].slice(0,3)+'</b><div>'+x.miss+'</div><div>'+x.busy+'</div><div>'+x.done+'</div><div>'+(x.score===null?'—':x.score+'%')+'</div></div>'}).join('')+'</div><div class="section">Final reflection</div><div class="card"><textarea id="ref" placeholder="What changed from October to January?">'+(db.reflection||'')+'</textarea><button class="save" onclick="db.reflection=document.getElementById(\'ref\').value;save();alert(\'Saved\')">Save reflection</button></div>'}
function openRes(id,kk){let r=R.find(x=>x[0]===id);document.getElementById('st').textContent=r[1];document.getElementById('ss').textContent='Default is On track.';let o=r[4]==='habit'?[['ok','On track'],['bad','Missed']]:r[4]==='flex'?[['done','Done'],['busy','Busy / unavailable'],['bad','Not done']]:[['','Didn’t happen'],['handled','Handled well'],['improve','Could improve']];opts.innerHTML=o.map(x=>'<button class="opt" onclick="setS(\''+kk+'\',\''+id+'\',\''+x[0]+'\')"><b>'+x[1]+'</b><small>Choose only if this is relevant.</small></button>').join('');sheet.style.display='flex'}
function openDay(kk){document.getElementById('st').textContent=new Date(kk).toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'});document.getElementById('ss').textContent='Review only what needs attention.';opts.innerHTML=R.map(r=>'<button class="opt" onclick="openRes(\''+r[0]+'\',\''+kk+'\')"><b>'+r[1]+'</b><small>'+st(r[0],kk)[0]+'</small></button>').join('');sheet.style.display='flex'}
function setS(kk,id,v){if(v)D(kk)[id]=v;else delete D(kk)[id];save();closeSheet();render()}function closeSheet(){sheet.style.display='none'}function back(){if(sheet.style.display==='flex'){closeSheet();return}setView('today')}render();
</script></body></html>
